<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="دلسانا">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#EEF2E4"/>
      <stop offset=".55" stop-color="#E1E8D6"/>
      <stop offset="1" stop-color="#CFD9C0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".18" r=".65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rib" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C5D1B4" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#E9EFDF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#F7FAF1" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".2"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E4F35"/>
      <stop offset=".35" stop-color="#232E1C"/>
      <stop offset="1" stop-color="#0F140B"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4A5C3C" flood-opacity=".28"/>
    </filter>
    <filter id="dshadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#1B2415" flood-opacity=".38"/>
    </filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="1.6"/></filter>
    <clipPath id="tile"><rect width="512" height="512" rx="118"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- fluid swoosh -->
    <path id="ribbon" filter="url(#soft)" fill="url(#rib)"
      d="M30 456 C36 344 158 214 296 158 C372 126 442 96 478 140 C508 178 500 262 458 306 C424 344 360 346 322 330 C292 346 250 372 204 402 C160 432 112 458 78 468 C56 474 38 468 30 456 Z"/>
    <path d="M44 436 C70 340 170 232 298 172 C368 140 436 112 468 148" fill="none"
          stroke="url(#edge)" stroke-width="5" stroke-linecap="round" filter="url(#blur2)"/>
    <path d="M60 428 C92 350 176 256 292 196" fill="none" stroke="#fff" stroke-opacity=".7"
          stroke-width="2.4" stroke-linecap="round"/>
    <!-- bulb highlights -->
    <ellipse cx="462" cy="170" rx="9" ry="19" transform="rotate(-18 462 170)" fill="#fff" fill-opacity=".9"/>
    <path d="M420 120 C446 112 470 126 480 150" fill="none" stroke="#fff" stroke-opacity=".85"
          stroke-width="4" stroke-linecap="round" filter="url(#blur2)"/>
    <path d="M392 300 C420 322 456 306 474 266" fill="none" stroke="#fff" stroke-opacity=".6"
          stroke-width="3" stroke-linecap="round"/>
    <path d="M120 442 C190 410 258 368 318 330" fill="none" stroke="#fff" stroke-opacity=".75"
          stroke-width="3" stroke-linecap="round"/>

    <!-- D -->
    <g filter="url(#dshadow)">
      <path fill="url(#ink)" transform="translate(162.4 349) scale(.125 -.125)" d="M686 1500Q924 1500 1094.0 1405.5Q1264 1311 1355.0 1142.0Q1446 973 1446 750Q1446 582 1392.0 444.5Q1338 307 1237.5 207.5Q1137 108 997.0 54.0Q857 0 686 0H45V39H226V1461H45V1500ZM537 39H686Q802 39 880.5 94.0Q959 149 1006.5 246.5Q1054 344 1075.0 473.0Q1096 602 1096 750Q1096 898 1072.0 1027.0Q1048 1156 999.0 1253.5Q950 1351 872.5 1406.0Q795 1461 686 1461H537Z"/>
    </g>
    <path fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2.5"
          transform="translate(162.4 349) scale(.125 -.125)" d="M686 1500Q924 1500 1094.0 1405.5Q1264 1311 1355.0 1142.0Q1446 973 1446 750Q1446 582 1392.0 444.5Q1338 307 1237.5 207.5Q1137 108 997.0 54.0Q857 0 686 0H45V39H226V1461H45V1500ZM537 39H686Q802 39 880.5 94.0Q959 149 1006.5 246.5Q1054 344 1075.0 473.0Q1096 602 1096 750Q1096 898 1072.0 1027.0Q1048 1156 999.0 1253.5Q950 1351 872.5 1406.0Q795 1461 686 1461H537Z" clip-path="none"/>
  </g>
</svg>
