<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delsana Management — تست محاسبات</title>
<style>
  body { font-family: Vazirmatn, Tahoma, sans-serif; margin: 0; padding: 16px; background: #fafafa; color: #222; }
  h1 { font-size: 20px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; background: #fff; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: center; }
  th { background: #f0f0f0; }
  .pass { color: #0a7d32; font-weight: bold; }
  .fail { color: #c62828; font-weight: bold; }
  .box { padding: 10px 14px; border-radius: 8px; margin: 12px 0; font-weight: bold; }
  .ok { background: #e5f6ea; color: #0a7d32; }
  .bad { background: #fdecea; color: #c62828; }
  .inv { font-size: 12px; color: #555; }
  code { background: #f3f3f3; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<h1>تست محاسبات مالی — Delsana Management</h1>
<p class="inv">ده مثال کارشده از پروژه + بررسی ثابت <code>owe + h_share == net + shipping_fee</code> برای هر مثال.</p>
<div id="summary" class="box">در حال اجرا…</div>
<table id="results">
  <thead>
    <tr>
      <th>#</th><th>شرح</th><th>کل مشتری</th><th>پرداختی به مهدی</th><th>سهم هلیا</th>
      <th>سود مهدی</th><th>سهم بن</th><th>کارمزد بن</th><th>ثابت</th><th>نتیجه</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
<script src="calc.js"></script>
<script>
(function () {
  'use strict';
  var COST = 400000, MP = 100000, HP = 150000, POST = 190000, STEP = 5000;
  var ITEM = { qty: 1, cost: COST, mp: MP, hp: HP, base: COST + MP };

  function make(extra) {
    var o = {
      items: [ITEM], discount: 0, discount_bearer: 'helia',
      shipping_method: 'post', payment_method: 'cash',
      post_fee: POST, snapp_multiplier: 1.15, rounding_step: STEP
    };
    if (extra) for (var k in extra) o[k] = extra[k];
    return o;
  }

  /* The 10 worked examples from the specification. */
  var CASES = [
    { d: 'نقد، پست، بدون تخفیف', in: {}, exp: { customer_total: 840000, owe: 690000, h_share: 150000, m_profit: 100000 } },
    { d: 'نقد، پیک، بدون تخفیف', in: { shipping_method: 'courier' }, exp: { customer_total: 650000, owe: 500000, h_share: 150000, m_profit: 100000 } },
    { d: 'اسنپ‌پی ۱٫۱۵، پست، بدون تخفیف', in: { payment_method: 'snapp' }, exp: { customer_total: 940000, payout: 840000, owe: 690000, h_share: 150000, m_profit: 100000 } },
    { d: 'اسنپ‌پی ۱٫۱۵، پیک، بدون تخفیف', in: { payment_method: 'snapp', shipping_method: 'courier' }, exp: { customer_total: 750000, payout: 650000, owe: 500000 } },
    { d: 'اسنپ‌پی ۱٫۲، پست، بدون تخفیف', in: { payment_method: 'snapp', snapp_multiplier: 1.2 }, exp: { customer_total: 970000, payout: 840000 } },
    { d: 'نقد، پست، تخفیف ۵۰٬۰۰۰ بر عهده هلیا', in: { discount: 50000, discount_bearer: 'helia' }, exp: { customer_total: 790000, owe: 690000, h_share: 100000, m_profit: 100000 } },
    { d: 'نقد، پست، تخفیف ۵۰٬۰۰۰ بر عهده مهدی', in: { discount: 50000, discount_bearer: 'mahdi' }, exp: { customer_total: 790000, owe: 640000, h_share: 150000, m_profit: 50000 } },
    { d: 'نقد، پست، تخفیف ۵۰٬۰۰۰ تقسیم مساوی', in: { discount: 50000, discount_bearer: 'split' }, exp: { customer_total: 790000, owe: 665000, h_share: 125000, m_profit: 75000 } },
    { d: 'نقد، پست، تخفیف ۵۰٬۰۰۱ تقسیم مساوی', in: { discount: 50001, discount_bearer: 'split' }, exp: { mahdi_discount: 25000, helia_discount: 25001, owe: 665000, h_share: 124999, m_profit: 75000 } },
    { d: 'اسنپ‌پی ۱٫۱۵، پست، تخفیف ۵۰٬۰۰۰ بر عهده هلیا', in: { payment_method: 'snapp', discount: 50000, discount_bearer: 'helia' }, exp: { net: 600000, customer_total: 880000, payout: 790000 } }
  ];

  var tbody = document.querySelector('#results tbody');
  var pass = 0, fail = 0;

  function cell(txt, ok) {
    var td = document.createElement('td');
    td.textContent = txt;
    td.className = ok ? 'pass' : 'fail';
    return td;
  }

  CASES.forEach(function (c, i) {
    var got, err = null;
    try { got = Calc.calcOrder(make(c.in)); } catch (e) { err = e; }

    var checks = [];
    if (err) {
      checks.push({ k: 'بدون خطا', ok: false, got: err.message });
    } else {
      Object.keys(c.exp).forEach(function (k) {
        checks.push({ k: k, ok: got[k] === c.exp[k], got: got[k], exp: c.exp[k] });
      });
      checks.push({ k: 'invariant', ok: got.invariant_ok === true, got: String(got.invariant_ok) });
    }

    var allOk = checks.every(function (x) { return x.ok; });
    allOk ? pass++ : fail++;

    var tr = document.createElement('tr');
    var cells = [
      String(i + 1),
      c.d,
      err ? '—' : String(got.customer_total),
      err ? '—' : String(got.owe),
      err ? '—' : String(got.h_share),
      err ? '—' : String(got.m_profit),
      err ? '—' : String(got.net),
      err ? '—' : String(got.customer_total - got.net),
      allOk ? '✓' : '✗'
    ];
    cells.forEach(function (t) {
      var td = document.createElement('td');
      td.textContent = t;
      tr.appendChild(td);
    });
    var res = document.createElement('td');
    res.className = allOk ? 'pass' : 'fail';
    res.textContent = allOk ? 'PASS' : 'FAIL — ' + checks.filter(function (x) { return !x.ok; })
      .map(function (x) { return x.k + ' exp=' + x.exp + ' got=' + x.got; }).join(' | ');
    tr.appendChild(res);
    tbody.appendChild(tr);
  });

  var box = document.getElementById('summary');
  if (fail === 0) {
    box.className = 'box ok';
    box.textContent = 'PASS — همه ' + pass + ' مثال و بررسی ثابت با موفقیت اجرا شدند.';
  } else {
    box.className = 'box bad';
    box.textContent = 'FAIL — ' + fail + ' مورد ناموفق از ' + (pass + fail);
  }
  window.__TEST_RESULT__ = { pass: pass, fail: fail };
})();
</script>
</body>
</html>
